#toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-90px);background:rgba(40,40,42,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#fff;padding:11px 20px;border-radius:99px;font:600 15px var(--hd);transition:transform .35s cubic-bezier(.3,1.4,.5,1);z-index:60;box-shadow:0 8px 28px rgba(0,0,0,.25);white-space:nowrap}#toast.show{transform:translate(-50%,0)}

</style></head><body><main>
<header><div><div class="sub">Lock in. Level up.</div><h1>Healthmaxxing Year</h1></div><div class="logo">🔒</div></header>
<div id="app"></div></main><nav id="nav"></nav><div id="toast"></div><div id="lvl" onclick="this.classList.remove('show')"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL="PASTE_YOUR_PROJECT_URL",SUPABASE_KEY="PASTE_YOUR_ANON_KEY";
const LV=[0,100,250,450,700,1000,1350,1750,2200,2700,3250,3850,4500,5200,6000,6850,7750,8700,9700,10750,11850,13000,14200,15450,16750,18100,19500,21000,22600,24250];
const RK="New Player,Rookie,Beginner,Apprentice,Trainee,Explorer,Adventurer,Skilled,Competent,Veteran,Experienced,Specialist,Elite,Expert,Master (wu),Champion,Hero,Veteran hero,Master,Grandmaster,Doctor,Doyen,Puppeteer,Legend,Monk,Legendary monk,Mythic,Immortal,Ascend,MAX LEVEL 🔥".split(",");
const PR=[25000,30000,40000,50000,75000],RN=["I","II","III","IV","V"];
const CAT={F:"🏃 Fitness",I:"🧠 Intellect",C:"🎨 Creativity",L:"🧹 Life skills",M:"🧘 Mental",D:"📵 Discipline",S:"🧑‍🤝‍🧑 Social",E:"🌎 Exploring"};
const RAW=`d F 10 min walk,5
d F 20 min walk,10
d F Stretch session (5-10 mins),10

w F Exercise twice +30 mins,30

w D Be nice to others,40

const Q=RAW.split("\n").map(l=>{const t=l[0],c=l[2],r=l.slice(4),i=r.lastIndexOf(",");return{t,c,n:r.slice(0,i),x:+r.slice(i+1)}});
const qs=()=>Q.concat(cfg.qAdd||[]).filter(q=>!(cfg.qDel||[]).includes(q.t+q.c+q.n));
const RULES=["Eat healthy: 50% veggies, 25% carbs, 25% protein, 3 meals/day","Work out at least 1 hour/day","Study at least 20 min/day","Max 2h screen time/day (send proof in gc)","Base rules give NO XP. Quests, events and bosses do."];
const $=s=>document.getElementById(s);
const pad=n=>String(n).padStart(2,"0"),D=new Date();
const day=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const wk=()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const mo=()=>day().slice(0,7);
const per=t=>t=="d"?day():t=="w"?wk():mo();
const lvl=x=>{let i=0;LV.forEach((v,j)=>{if(x>=v)i=j});return i};
const pres=x=>PR.filter(p=>x>=p).length;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let cfg={wW:[],wM:[],boss:[],mot:[],spin:{}},evTab="boss",db=null,me=null,mine={name:"",log:[]},all={},tab="home",viewing=null,tier="d",cat="all";
const xpOf=l=>(l||[]).reduce((a,e)=>a+e.x,0);
async function save(){
  mine.xp=xpOf(mine.log);
  if(lastXp!==null&&mine.xp>lastXp){if(lvl(mine.xp)>lvl(lastXp))levelUp(lvl(mine.xp));toast("+"+(mine.xp-lastXp)+" XP")}
  lastXp=mine.xp;
  if(mine.log.length>600)mine.log=mine.log.slice(-600);
  all[me||"local"]=mine;render();
  if(db&&me){try{await db.collection("players").doc(me).set(mine)}catch(e){console.error(e)}}
}
function done(q){return mine.log.some(e=>e.k==q.t+q.c+q.n&&e.p==per(q.t))}
function toggle(q){
  const k=q.t+q.c+q.n,p=per(q.t),i=mine.log.findIndex(e=>e.k==k&&e.p==p);
  if(i>=0)mine.log.splice(i,1);else mine.log.push({k,p,x:q.x,n:q.n,t:Date.now()});
  save();
}
function addCustom(){
  const n=$("cn").value.trim(),x=parseInt($("cx").value);
  if(!n||!x)return;mine.log.push({k:"c",p:"",x,n,t:Date.now()});save();
}
async function saveCfg(){render();if(db){try{await db.doc("config/main").set(cfg)}catch(e){console.error(e)}}}
function addItem(l){const n=$("in_"+l).value.trim(),x=parseInt($("ix_"+l).value);if(!n||!x)return;cfg[l].push({n,x});$("in_"+l).value="";$("ix_"+l).value="";saveCfg()}
function delItem(l,i){if(confirm("Remove this for everyone?")){cfg[l].splice(i,1);saveCfg()}}
function claim(k,n,x){const i=mine.log.findIndex(e=>e.k==k);if(i>=0)mine.log.splice(i,1);else mine.log.push({k,p:"",x,n,t:Date.now()});save()}
function spin(s){
  const l=cfg[s=="w"?"wW":"wM"];if(l.length<2)return;
  const el=$("roll_"+s);let c=0;
  const iv=setInterval(()=>{el.textContent=l[Math.floor(Math.random()*l.length)].n;if(++c>18){clearInterval(iv);const p=l[Math.floor(Math.random()*l.length)];cfg.spin[s]={n:p.n,x:p.x,id:Date.now()};saveCfg()}},90);
}
const addBox=l=>`<div class="row" style="margin-top:8px"><input id="in_${l}" placeholder="name"><input id="ix_${l}" type="number" placeholder="XP" style="width:80px"><button onclick="addItem('${l}')">Add</button></div>`;
const itemList=l=>cfg[l].map((it,i)=>`<div class="q"><div>${esc(it.n)}</div><div class="row"><span class="xp">${it.x} XP</span><button onclick="delItem('${l}',${i})">✕</button></div></div>`).join("")||'<div class="mu">Empty. Add some below.</div>';
function undo(t){mine.log=mine.log.filter(e=>e.t!==t);save()}
function setName(){const n=$("nm").value.trim();if(!n)return;mine.name=n;save()}
function prog(x){
  const l=lvl(x),p=pres(x);let s;
  if(l<29){const a=LV[l],b=LV[l+1];s=`<div class="bar"><i style="width:${(x-a)/(b-a)*100}%"></i></div><div class="mu">${b-x} XP to Lvl ${l+2}</div>`}
  else if(p<5){const a=p?PR[p-1]:LV[29],b=PR[p];s=`<div class="bar"><i style="width:${Math.max(0,(x-a)/(b-a)*100)}%"></i></div><div class="mu">${b-x} XP to Prestige ${RN[p]}</div>`}
  else s=`<div class="mu">touch grass. eat mcdonalds. 💔</div>`;
  return s;
}
const title=x=>{const p=pres(x);return (p?"Prestige "+RN[p-1]+" · ":"")+"Lvl "+(lvl(x)+1)+" · "+RK[lvl(x)]};
const pct=x=>{const l=lvl(x),p=pres(x);if(l<29)return(x-LV[l])/(LV[l+1]-LV[l]);if(p<5){const a=p?PR[p-1]:LV[29];return Math.max(0,(x-a)/(PR[p]-a))}return 1};
let lastXp=null,tt,isAdmin=false;
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2200)}
function levelUp(i){const o=$("lvl");o.innerHTML=`<div class="sheet"><div class="mu">Level up</div><h2>Level ${i+1}</h2><div class="rank">${RK[i]}</div><div class="mu" style="margin-top:14px">Tap to continue</div></div>`;o.classList.add("show");setTimeout(()=>o.classList.remove("show"),2800)}
const dk=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
function stats(log){
  const days={},cats={};
  log.forEach(e=>{const k=dk(new Date(e.t));days[k]=(days[k]||0)+e.x;const c=("dwm".includes(e.k[0])&&CAT[e.k[1]])?e.k[1]:"o";cats[c]=(cats[c]||0)+e.x});
  const last=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);last.push([d.toLocaleDateString(undefined,{weekday:"short"}),days[dk(d)]||0])}
  let st=0;const d=new Date();if(!days[dk(d)])d.setDate(d.getDate()-1);while(days[dk(d)]){st++;d.setDate(d.getDate()-1)}
  const m=mo();
  return{last,st,cats,week:last.reduce((a,b)=>a+b[1],0),month:log.filter(e=>dk(new Date(e.t)).slice(0,7)==m).reduce((a,e)=>a+e.x,0),best:Math.max(0,...Object.values(days)),n:log.length,today:log.filter(e=>e.p==day()&&e.k[0]=="d"&&CAT[e.k[1]]).length}
}
function home(p,own){
  const log=p.log||[],x=xpOf(log),S=stats(log),mx=Math.max(1,...S.last.map(a=>a[1])),dn=Math.max(1,qs().filter(q=>q.t=="d").length);
  const cs=Object.entries(S.cats).sort((a,b)=>b[1]-a[1]),cm=Math.max(1,...cs.map(c=>c[1]));
  let h=own?"":`<div class="card row"><b>Viewing ${esc(p.name||"?")}</b><button onclick="viewing=null;render()">Back to me</button></div><div class="card"><div class="big">${x} XP</div><div class="rank">${title(x)}</div>${prog(x)}</div>`;
  h+=`<div class="grid"><div class="card"><div class="big">🔥 ${S.st}</div><div class="mu">day streak</div></div><div class="card"><div class="big">${S.week}</div><div class="mu">XP last 7 days</div></div><div class="card"><div class="big">${S.month}</div><div class="mu">XP this month</div></div><div class="card"><div class="big">${S.best}</div><div class="mu">best day XP</div></div></div>`;
  h+=`<div class="card"><b>Last 7 days</b><div class="cols" style="margin-top:8px">${S.last.map(a=>`<div><i style="height:${a[1]/mx*60}px"></i>${a[1]}<br>${a[0]}</div>`).join("")}</div></div>`;
  h+=`<div class="card"><b>Today's dailies</b><div class="bar"><i style="width:${Math.min(100,S.today/dn*100)}%"></i></div><div class="mu">${S.today} done today · ${S.n} total completions</div></div>`;
  h+=`<div class="card"><b>XP by category</b>`+(cs.map(([c,v])=>`<div style="margin-top:8px"><div class="row"><span>${CAT[c]||"⭐ Events & custom"}</span><span class="xp">${v}</span></div><div class="bar"><i style="width:${v/cm*100}%"></i></div></div>`).join("")||'<div class="mu">No data yet.</div>')+`</div>`;
  return h;
}
function render(){
  if(!me){$("nav").innerHTML="";$("app").innerHTML=authCard();return}
  const x=xpOf(mine.log),tabs=[["home","🏠 Home"],["board","🏆 Board"],["quests","⚔️ Missions"],["wheel","🎡 Wheel"],["ev","👹 Events"],["log","📜 Log"],["rules","📋 Rules"]];if(isAdmin)tabs.push(["admin","🛡️ Admin"]);
  $("nav").innerHTML=tabs.map(t=>{const[e,...w]=t[1].split(" ");return `<button class="${tab==t[0]?"on":""}" onclick="tab='${t[0]}';window.scrollTo(0,0);render()"><b>${e}</b>${w.join(" ")}</button>`}).join("");let h="";
  if(!mine.name)h+=`<div class="card"><b>Pick your name</b><div class="row" style="margin-top:8px"><input id="nm" placeholder="your name" maxlength="20"><button onclick="setName()">Join</button></div></div>`;
  else{const l=lvl(x),S=stats(mine.log),on=S.last[6][1]>0;h+=`<div class="hero"><div class="ring" style="--p:${pct(x)*100}"><b>${l+1}</b><span>LVL</span></div><div class="hi"><span class="chip ${on?"on":""}">${on?"🔒 Locked in":"🔓 Not locked in"}${S.st?` · 🔥 ${S.st} day${S.st>1?"s":""}`:""}</span><div class="hname">${esc(mine.name)}</div><div class="rank">${title(x)}</div><div class="xpn">${x} <small>XP</small></div></div><button class="ghost" onclick="logout()" title="Log out">⎋</button></div><div class="card slim">${prog(x)}</div>`}
  if(!db)h+=`<div class="card mu">Not synced. Sign in to claude.ai and open the shared link to use your own account and share progress.</div>`;
  if(tab=="home"){const o=!viewing||viewing==(me||"local");h+=home(o?mine:(all[viewing]||{log:[]}),o)}
  if(tab=="board"){
    const L=Object.entries(all).map(([id,p])=>({id,n:p.name||"?",x:xpOf(p.log)})).sort((a,b)=>b.x-a.x);
    h+=L.length?L.map((p,i)=>`<div class="card row" style="cursor:pointer" onclick="viewing='${p.id}';tab='home';render()"><div><b>${i+1}. ${esc(p.n)}</b>${p.id==(me||"local")?" (you)":""}<div class="mu">${title(p.x)}</div></div><div class="xp">${p.x} XP</div></div>`).join(""):`<div class="card mu">No players yet.</div>`;
  }
  if(tab=="quests"){
    h+=`<div class="tabs">${[["d","Daily"],["w","Weekly"],["m","Monthly"]].map(t=>`<button class="${tier==t[0]?"on":""}" onclick="tier='${t[0]}';render()">${t[1]}</button>`).join("")}</div>`;
    h+=`<div class="tabs"><button class="${cat=="all"?"on":""}" onclick="cat='all';render()">All</button>${Object.entries(CAT).map(([k,v])=>`<button class="${cat==k?"on":""}" onclick="cat='${k}';render()">${v}</button>`).join("")}</div>`;
    h+=`<div class="card">`+qs().map((q,i)=>({q,i})).filter(o=>o.q.t==tier&&(cat=="all"||o.q.c==cat)).map(o=>{const d=done(o.q);return `<div class="q ${d?"done":""}"><div><div>${d?"✅ ":""}${esc(o.q.n)}</div><div class="mu">${CAT[o.q.c]}</div></div><div class="row"><span class="xp">+${o.q.x}</span>${isAdmin?`<button onclick="qRemove(${o.i})" title="Remove quest">✕</button>`:""}<button class="lock ${d?"on":""}" onclick="toggle(qs()[${o.i}])">${d?"✓ Locked":"Lock in"}</button></div></div>`}).join("")+`</div>`;
    if(isAdmin)h+=`<div class="card"><b>🛡️ Add a ${{d:"daily",w:"weekly",m:"monthly"}[tier]} quest</b><div style="display:grid;gap:8px;margin-top:8px"><input id="qn" placeholder="Quest name"><select id="qc">${Object.entries(CAT).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select><div class="row"><input id="qx" type="number" placeholder="XP"><button class="on" onclick="qAdd()">Add quest</button></div></div></div>`;
    h+=`<div class="card"><b>Wheel event / boss / custom XP</b><div class="mu">Self-award what the wheel or a boss battle gives.</div><div class="row" style="margin-top:8px"><input id="cn" placeholder="what happened"><input id="cx" type="number" placeholder="XP" style="width:90px"><button onclick="addCustom()">Add</button></div></div>`;
  }
  if(tab=="wheel")h+=[["w","wW","Weekly wheel"],["m","wM","Monthly wheel"]].map(([s,l,t])=>{const r=cfg.spin[s],k="wheel"+(r&&r.id),d=r&&mine.log.some(e=>e.k==k);return `<div class="card"><b>🎡 ${t}</b><div class="mu">Spin once for the whole gc. Results show for everyone.</div><div id="roll_${s}" class="big" style="margin:8px 0">${r?esc(r.n):"?"}</div>${r?`<div class="row"><span class="xp">+${r.x} XP</span><button onclick="claim('${k}','${esc(r.n).replace(/'/g,"")}',${r.x})">${d?"Undo claim":"Claim XP"}</button></div>`:""}<button style="margin:8px 0" onclick="spin('${s}')">Spin</button>${itemList(l)}${addBox(l)}</div>`}).join("");
  if(tab=="ev"){const L=evTab;h+=`<div class="tabs"><button class="${L=="boss"?"on":""}" onclick="evTab='boss';render()">Boss battles</button><button class="${L=="mot"?"on":""}" onclick="evTab='mot';render()">Motivational</button></div><div class="card">`+(cfg[L].map((it,i)=>{const k=("e"+L+it.n).replace(/['"&<>]/g,""),d=mine.log.some(e=>e.k==k);return `<div class="q ${d?"done":""}"><div>${d?"✅ ":""}${esc(it.n)}</div><div class="row"><span class="xp">+${it.x}</span><button onclick="claim('${k}',this.dataset.n,${it.x})" data-n="${esc(it.n)}">${d?"Undo":"Done"}</button><button onclick="delItem('${L}',${i})">✕</button></div></div>`}).join("")||'<div class="mu">Empty. Add some below.</div>')+addBox(L)+`</div>`}
  if(tab=="log")h+=`<div class="card">`+(mine.log.length?[...mine.log].reverse().slice(0,100).map(e=>`<div class="q"><div>${esc(e.n)}<div class="mu">${new Date(e.t).toLocaleDateString()}</div></div><div class="row"><span class="xp">+${e.x}</span><button onclick="undo(${e.t})">✕</button></div></div>`).join(""):`<span class="mu">Nothing yet.</span>`)+`</div>`;
  if(tab=="admin"&&isAdmin)h+=`<div class="card"><b>🛡️ Admin</b><div class="mu">Reset a player's XP or delete their account. Deleting is permanent.</div></div>`+Object.entries(all).map(([id,p])=>`<div class="card row"><div><b>${esc(p.name||"?")}</b>${id==me?" (you)":""}<div class="mu">${xpOf(p.log)} XP</div></div><div class="row"><button onclick="adminReset('${id}')">Reset XP</button>${id==me?"":`<button onclick="adminDelete('${id}')">Delete</button>`}</div></div>`).join("");
  if(tab=="rules")h+=`<div class="card"><b>Base rules (no XP)</b><ul>${RULES.map(r=>`<li>${r}</li>`).join("")}</ul><div class="mu">Weekly and monthly wheels are forced events for the whole gc: 15-150 XP, up to 450 on "suffer".</div></div>`;
  const v={};document.querySelectorAll("#app input,#app select").forEach(i=>v[i.id]=i.value);
  $("app").innerHTML=h;
  for(const id in v){const i=$(id);if(i)i.value=v[id]}
}
let sb=null,authMode="up",authErr="",authOk="",booting=true;
function authCard(){
  if(booting&&!SUPABASE_URL.startsWith("PASTE"))return `<div class="card auth"><div class="logo">🔒</div><div class="mu">Loading…</div></div>`;
  if(SUPABASE_URL.startsWith("PASTE"))return `<div class="card"><b>Setup needed</b><div class="mu">Paste your Supabase URL and anon key at the top of index.html (see README).</div></div>`;
  const up=authMode=="up",rs=authMode=="reset";
  const f=rs?`<input id="anp" type="password" placeholder="New password (6+ characters)" autocomplete="new-password"><button class="on" onclick="updatePw()">Save new password</button>`:
   `${up?`<input id="af" placeholder="First name" autocomplete="given-name"><input id="al" placeholder="Family name" autocomplete="family-name">`:""}<input id="ae" type="email" placeholder="Email" autocomplete="email"><input id="ap" type="password" placeholder="Password (6+ characters)" autocomplete="${up?"new-password":"current-password"}"><button class="on" onclick="doAuth()">${up?"Sign up":"Log in"}</button><button onclick="authMode='${up?"in":"up"}';authErr='';authOk='';render()">${up?"I already have an account":"Create an account"}</button>${up?"":`<button class="link" onclick="forgot()">Forgot password?</button>`}`;
  return `<div class="card auth"><div class="logo">🔥</div><h2>${rs?"New password":up?"Join the arc":"Welcome back"}</h2><div class="mu">${up?"Create your account and start earning XP with the gc":"Log in to see the board"}</div><div class="g">${f}</div><div style="margin-top:10px;color:#d33;font-size:13px">${esc(authErr)}</div><div style="margin-top:10px;color:var(--ac);font-size:13px">${esc(authOk)}</div></div>`;
}
async function doAuth(){
  const e=$("ae").value.trim(),p=$("ap").value,up=authMode=="up",f=up?$("af").value.trim():"",l=up?$("al").value.trim():"";
  if(!e||p.length<6||(up&&(!f||!l))){authErr=up?"Enter first name, family name, email and a 6+ character password.":"Enter your email and password.";authOk="";render();return}
  const back=location.href.split("#")[0];
  const r=up?await sb.auth.signUp({email:e,password:p,options:{data:{name:f+" "+l},emailRedirectTo:back}}):await sb.auth.signInWithPassword({email:e,password:p});
  if(r.error){authErr=r.error.message;authOk="";render();return}
  if(!r.data.session){authErr="";authOk="Account created. Check your email to confirm it, then log in.";authMode="in";render();return}
  start(r.data.session);
}
async function forgot(){
  const e=$("ae").value.trim();if(!e){authErr="Type your email first.";authOk="";render();return}
  const r=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.href.split("#")[0]});
  authErr=r.error?r.error.message:"";authOk=r.error?"":"Reset link sent. Check your email.";render();
}
async function updatePw(){
  const p=$("anp").value;if(p.length<6){authErr="Use 6+ characters.";render();return}
  const r=await sb.auth.updateUser({password:p});if(r.error){authErr=r.error.message;render();return}
  history.replaceState(null,"",location.pathname);const {data}=await sb.auth.getSession();start(data.session);
}
function qAdd(){
  const n=$("qn").value.trim(),x=parseInt($("qx").value),c=$("qc").value;if(!n||!x)return;
  (cfg.qAdd=cfg.qAdd||[]).push({t:tier,c,n,x});saveCfg();toast("Quest added");
}
function qRemove(i){
  const q=qs()[i];if(!q||!confirm("Remove \""+q.n+"\" for everyone?"))return;
  const k=q.t+q.c+q.n,j=(cfg.qAdd||[]).findIndex(a=>a.t+a.c+a.n==k);
  if(j>=0)cfg.qAdd.splice(j,1);else(cfg.qDel=cfg.qDel||[]).push(k);
  saveCfg();toast("Quest removed");
}
async function adminReset(id){
  if(!confirm("Reset this player's XP to 0?"))return;
  const d={...all[id],log:[],xp:0,reset:Date.now()};
  const r=await sb.from("players").update({data:d}).eq("id",id);
  if(r.error){toast(r.error.message);return}
  all[id]=d;if(id==me){mine=d;lastXp=0}render();toast("XP reset");
}
async function adminDelete(id){
  if(!confirm("Delete "+(all[id].name||"this player")+"'s account permanently?"))return;
  const r=await sb.rpc("admin_delete_user",{target:id});
  if(r.error){toast(r.error.message);return}
  delete all[id];render();toast("Account deleted");
}
async function logout(){await sb.auth.signOut();location.reload()}
const chk=r=>{if(r.error)throw r.error};
async function start(sess){
  me=sess.user.id;const nm=(sess.user.user_metadata||{}).name||"Player";
  db={collection:()=>({doc:id=>({set:d=>sb.from("players").upsert({id,data:d}).then(chk)})}),doc:()=>({set:d=>sb.from("config").upsert({id:"main",data:d}).then(chk)})};
  const ps=await sb.from("players").select("id,data");(ps.data||[]).forEach(r=>all[r.id]=r.data);
  if(all[me]){mine={name:all[me].name||nm,log:all[me].log||[],reset:all[me].reset||0}}else{mine={name:nm,log:[]};await save()}
  all[me]=mine;lastXp=xpOf(mine.log);
  const ad=await sb.from("admins").select("id").eq("id",me).maybeSingle();isAdmin=!!ad.data;
  const c=await sb.from("config").select("data").eq("id","main").maybeSingle();
  if(c.data)cfg=Object.assign({wW:[],wM:[],boss:[],mot:[],spin:{}},c.data.data);
  sb.channel("hm").on("postgres_changes",{event:"*",schema:"public",table:"players"},p=>{if(p.eventType=="DELETE"){if(p.old&&p.old.id)delete all[p.old.id];render();return}const n=p.new;if(n&&n.id){all[n.id]=n.data;if(n.id==me&&(n.data.reset||0)>(mine.reset||0)){mine={name:n.data.name||mine.name,log:n.data.log||[],reset:n.data.reset};lastXp=xpOf(mine.log)}else if(n.id==me&&(n.data.log||[]).length>mine.log.length){mine={name:n.data.name||mine.name,log:n.data.log};lastXp=xpOf(mine.log)}render()}}).on("postgres_changes",{event:"*",schema:"public",table:"config"},p=>{if(p.new&&p.new.data){cfg=Object.assign({wW:[],wM:[],boss:[],mot:[],spin:{}},p.new.data);render()}}).subscribe();
  render();
}
window.onerror=m=>{const a=document.getElementById("app");if(a)a.insertAdjacentHTML("beforeend",`<div class="card" style="color:#d33">Error: ${m}</div>`)};
(async()=>{
  render();
  if(SUPABASE_URL.startsWith("PASTE"))return;
  try{
    if(typeof supabase==="undefined")throw new Error("Could not load the Supabase library. Check your connection or turn off your ad blocker.");
    sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,storage:window.localStorage}});
    sb.auth.onAuthStateChange(ev=>{if(ev=="SIGNED_OUT"&&me)location.reload()});
    const {data}=await sb.auth.getSession();booting=false;
    if(location.hash.includes("type=recovery")){authMode="reset";render()}else if(data.session)start(data.session);else render();
  }catch(e){booting=false;authErr=String(e.message||e);render()}
})();
</script></body></html>
