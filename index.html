    h+=`<div class="card"><b>Wheel event / boss / custom XP</b><div class="mu">Self-award what the wheel or a boss battle gives.</div><div class="row" style="margin-top:8px"><input id="cn" placeholder="what happened"><input id="cx" type="number" placeholder="XP" style="width:90px"><button onclick="addCustom()">Add</button></div></div>`;
  }
  if(tab=="wheel")h+=[["w","wW","Weekly wheel"],["m","wM","Monthly wheel"]].map(([s,l,t])=>{const r=cfg.spin[s],k="wheel"+(r&&r.id),d=r&&mine.log.some(e=>e.k==k);return `<div class="card"><b>🎡 ${t}</b><div class="mu">Spin once for the whole gc. Results show for everyone.</div><div id="roll_${s}" class="big" style="margin:8px 0">${r?esc(r.n):"?"}</div>${r?`<div class="row"><span class="xp">+${r.x} XP</span><button onclick="claim('${k}','${esc(r.n).replace(/'/g,"")}',${r.x})">${d?"Undo claim":"Claim XP"}</button></div>`:""}<button style="margin:8px 0" onclick="spin('${s}')">Spin</button>${itemList(l)}${addBox(l)}</div>`}).join("");
  if(tab=="ev"){const L=evTab;h+=`<div class="tabs"><button class="${L=="boss"?"on":""}" onclick="evTab='boss';render()">Boss battles</button><button class="${L=="mot"?"on":""}" onclick="evTab='mot';render()">Motivational</button></div><div class="card">`+(cfg[L].map((it,i)=>{const k=("e"+L+it.n).replace(/['"&<>]/g,""),d=mine.log.some(e=>e.k==k);return `<div class="q ${d?"done":""}"><div>${d?"✅ ":""}${esc(it.n)}</div><div class="row"><span class="xp">+${it.x}</span><button onclick="claim('${k}',this.dataset.n,${it.x})" data-n="${esc(it.n)}">${d?"Undo":"Done"}</button><button onclick="delItem('${L}',${i})">✕</button></div></div>`}).join("")||'<div class="mu">Empty. Add some below.</div>')+addBox(L)+`</div>`}
  if(tab=="log")h+=`<div class="card">`+(mine.log.length?[...mine.log].reverse().slice(0,100).map(e=>`<div class="q"><div>${esc(e.n)}<div class="mu">${new Date(e.t).toLocaleDateString()}</div></div><div class="row"><span class="xp">+${e.x}</span><button onclick="undo(${e.t})">✕</button></div></div>`).join(""):`<span class="mu">Nothing yet.</span>`)+`</div>`;
  if(tab=="rules")h+=`<div class="card"><b>Base rules (no XP)</b><ul>${RULES.map(r=>`<li>${r}</li>`).join("")}</ul><div class="mu">Weekly and monthly wheels are forced events for the whole gc: 15-150 XP, up to 450 on "suffer".</div></div>`;
  const v={};document.querySelectorAll("#app input").forEach(i=>v[i.id]=i.value);
  $("app").innerHTML=h;
  for(const id in v){const i=$(id);if(i)i.value=v[id]}
}
render();
let sb=null,authMode="up",authErr="",authOk="";
function authCard(){
  if(SUPABASE_URL.startsWith("PASTE"))return `<div class="card"><b>Setup needed</b><div class="mu">Paste your Supabase URL and anon key at the top of index.html (see README).</div></div>`;
  const up=authMode=="up",rs=authMode=="reset";
  const f=rs?`<input id="anp" type="password" placeholder="New password (6+ characters)" autocomplete="new-password"><button class="on" onclick="updatePw()">Save new password</button>`:
   `${up?`<input id="af" placeholder="First name" autocomplete="given-name"><input id="al" placeholder="Family name" autocomplete="family-name">`:""}<input id="ae" type="email" placeholder="Email" autocomplete="email"><input id="ap" type="password" placeholder="Password (6+ characters)" autocomplete="${up?"new-password":"current-password"}"><button class="on" onclick="doAuth()">${up?"Sign up":"Log in"}</button><button onclick="authMode='${up?"in":"up"}';authErr='';authOk='';render()">${up?"I already have an account":"Create an account"}</button>${up?"":`<button class="link" onclick="forgot()">Forgot password?</button>`}`;
  return `<div class="card auth"><div class="logo">🔥</div><h2>${rs?"New password":up?"Join the arc":"Welcome back"}</h2><div class="mu">${up?"Create your account to track XP with the gc":"Log in to see the board"}</div><div class="g">${f}</div><div style="margin-top:10px;color:#d33;font-size:13px">${esc(authErr)}</div><div style="margin-top:10px;color:var(--ac);font-size:13px">${esc(authOk)}</div></div>`;
}
async function doAuth(){
  const e=$("ae").value.trim(),p=$("ap").value,up=authMode=="up",f=up?$("af").value.trim():"",l=up?$("al").value.trim():"";
  if(!e||p.length<6||(up&&(!f||!l))){authErr=up?"Enter first name, family name, email and a 6+ character password.":"Enter your email and password.";authOk="";render();return}
  const back=location.href.split("#")[0];
  const r=up?await sb.auth.signUp({email:e,password:p,options:{data:{name:f+" "+l},emailRedirectTo:back}}):await sb.auth.signInWithPassword({email:e,password:p});
  if(r.error){authErr=r.error.message;authOk="";render();return}
  if(!r.data.session){authErr="";authOk="Account created. Check your email to confirm it, then log in.";authMode="in";render();return}
  start(r.data.session);
}
async function forgot(){
  const e=$("ae").value.trim();if(!e){authErr="Type your email first.";authOk="";render();return}
  const r=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.href.split("#")[0]});
  authErr=r.error?r.error.message:"";authOk=r.error?"":"Reset link sent. Check your email.";render();
}
async function updatePw(){
  const p=$("anp").value;if(p.length<6){authErr="Use 6+ characters.";render();return}
  const r=await sb.auth.updateUser({password:p});if(r.error){authErr=r.error.message;render();return}
  history.replaceState(null,"",location.pathname);const {data}=await sb.auth.getSession();start(data.session);
}
async function logout(){await sb.auth.signOut();location.reload()}
const chk=r=>{if(r.error)throw r.error};
async function start(sess){
  me=sess.user.id;const nm=(sess.user.user_metadata||{}).name||"Player";
  db={collection:()=>({doc:id=>({set:d=>sb.from("players").upsert({id,data:d}).then(chk)})}),doc:()=>({set:d=>sb.from("config").upsert({id:"main",data:d}).then(chk)})};
  const ps=await sb.from("players").select("id,data");(ps.data||[]).forEach(r=>all[r.id]=r.data);
  if(all[me]){mine={name:all[me].name||nm,log:all[me].log||[]}}else{mine={name:nm,log:[]};await save()}
  all[me]=mine;lastXp=xpOf(mine.log);
  const c=await sb.from("config").select("data").eq("id","main").maybeSingle();
  if(c.data)cfg=Object.assign({wW:[],wM:[],boss:[],mot:[],spin:{}},c.data.data);
  sb.channel("hm").on("postgres_changes",{event:"*",schema:"public",table:"players"},p=>{const n=p.new;if(n&&n.id){all[n.id]=n.data;if(n.id==me&&(n.data.log||[]).length>mine.log.length){mine={name:n.data.name||mine.name,log:n.data.log};lastXp=xpOf(mine.log)}render()}}).on("postgres_changes",{event:"*",schema:"public",table:"config"},p=>{if(p.new&&p.new.data){cfg=Object.assign({wW:[],wM:[],boss:[],mot:[],spin:{}},p.new.data);render()}}).subscribe();
  render();
}
(async()=>{
  if(SUPABASE_URL.startsWith("PASTE")){render();return}
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const {data}=await sb.auth.getSession();
  if(location.hash.includes("type=recovery")){authMode="reset";render()}else if(data.session)start(data.session);else render();
})();
</script></body></html>
